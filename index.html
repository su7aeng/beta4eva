<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beta4eva — 영원한 베타</title>
<meta name="description" content="만들다 만 것들, 만드는 중인 것들, 앞으로도 계속 베타일 것들.">
<meta property="og:title" content="beta4eva">
<meta property="og:description" content="영원한 베타. 개인 실험실.">
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --line:#232830;
    --fg:#e6e9ef; --dim:#8b93a1; --faint:#5b636f;
    --acc:#7cf2b0; --acc2:#ffcc66;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
       font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}
  header{padding:72px 0 40px;border-bottom:1px solid var(--line)}
  .logo{font-size:clamp(38px,9vw,68px);font-weight:700;letter-spacing:-.04em;line-height:1;margin:0}
  .logo em{font-style:normal;color:var(--acc)}
  .ver{display:inline-block;margin-top:16px;font-size:12px;color:var(--faint);
       border:1px solid var(--line);border-radius:99px;padding:3px 10px}
  .tag{margin:18px 0 0;color:var(--dim);max-width:52ch}
  .blink{display:inline-block;width:8px;height:15px;background:var(--acc);
         vertical-align:-2px;margin-left:4px;animation:b 1.1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}
  section{padding:40px 0;border-bottom:1px solid var(--line)}
  h2{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
     color:var(--faint);margin:0 0 20px}
  .list{display:grid;gap:10px}
  .item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:baseline;
        background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:16px 18px;text-decoration:none;color:inherit;
        transition:border-color .15s,transform .15s,background .15s}
  a.item:hover{border-color:var(--acc);transform:translateY(-1px);background:#151920}
  span.item{opacity:.55}
  .nm{font-weight:600;letter-spacing:-.01em}
  .nm::before{content:"› ";color:var(--faint)}
  .ds{grid-column:1/-1;color:var(--dim);font-size:13px;line-height:1.55}
  .st{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
      border:1px solid currentColor;border-radius:99px;padding:2px 8px;white-space:nowrap}
  .st.live{color:var(--acc)} .st.beta{color:var(--acc2)} .st.wip{color:var(--faint)}
  footer{padding:36px 0 64px;color:var(--faint);font-size:12.5px}
  footer p{margin:0 0 6px}
  @media (max-width:520px){
    header{padding:52px 0 32px}
    .item{grid-template-columns:1fr}
    .st{justify-self:start}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 class="logo">beta<em>4eva</em><span class="blink"></span></h1>
    <div class="ver">v0.∞ — never shipping v1</div>
    <p class="tag">만들다 만 것들, 만드는 중인 것들, 앞으로도 계속 베타일 것들. 개인 실험실.</p>
  </header>

  <section>
    <h2>Projects</h2>
    <div class="list">

      <!--
        개인 프로젝트만. 업무 관련은 올리지 말 것 (Public 레포라 소스 전체 노출됨).

        페이지를 올린 뒤 링크 살리는 법:
        <span class="item">  ->  <a class="item" href="./seren/">
        </span>              ->  </a>
        상태 뱃지는 soon / wip / beta / live 중 선택. class 도 같이 바꾸기.
      -->

      <span class="item">
        <span class="nm">seren</span>
        <span class="st wip">soon</span>
        <span class="ds">X 포스트 일별 요약 트래커. 매일 자동 갱신.</span>
      </span>

      <span class="item">
        <span class="nm">coin</span>
        <span class="st wip">soon</span>
        <span class="ds">업비트 데이터 대시보드.</span>
      </span>

      <span class="item">
        <span class="nm">taut</span>
        <span class="st wip">soon</span>
        <span class="ds">테슬라 용품 수입 소싱 리서치.</span>
      </span>

      <!-- 새 프로젝트 추가용 — 복사해서 이름/설명만 바꾸기
      <span class="item">
        <span class="nm">프로젝트명</span>
        <span class="st wip">soon</span>
        <span class="ds">한 줄 설명.</span>
      </span>
      -->

    </div>
  </section>

  <footer>
    <p>everything here is unfinished on purpose.</p>
    <p>beta4eva.pages.dev</p>
  </footer>

</div>
</body>
</html>
